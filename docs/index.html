<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F1 Analysis Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f5f7fa;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #0066cc;
    }
    .card p {
      font-size: 14px;
      color: #555;
    }
    .card a {
      display: inline-block;
      margin-top: 10px;
      color: #0066cc;
      text-decoration: none;
    }
    .card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>F1 Analysis Dashboard</h1>
  <div class="grid">
    <div class="card">
      <h2>Tyre Degradation</h2>
      <p>Analyze tyre performance trends, expected lifespan, and degradation patterns per driver and compound.</p>
      <a href="tyre_degradation.html" target="_blank">View Report →</a>
    </div>
  </div>
</body>
</html>
