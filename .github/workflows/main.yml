name: Deploy Marimo App to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Export
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository code
      - uses: actions/checkout@v4

      # 2. Set up Python
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # 3. Install Marimo
      - name: Install marimo
        run: pip install marimo

      # 4. Intall requirements
      - name: Install requirements
        run: pip install -r tyre_degradation/requirements.txt

      # 5. Export your Marimo dashboard to static HTML (WASM-powered)
      - name: Export Marimo notebooks
        run: |
          mkdir -p output_dir
          marimo export html-wasm tyre_degradation/analysis.py -o output_dir/tyre_degradation.html --mode run

      # 6. Add .nojekyll to prevent GitHub Pages from ignoring files/folders starting with "_"
      - name: Add .nojekyll
        run: touch output_dir/.nojekyll

      # 7. Upload the exported HTML as an artifact for deployment
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output_dir

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      # 8. Deploy the artifact to GitHub Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
